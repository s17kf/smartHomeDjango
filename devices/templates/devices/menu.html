<ul class="navbar-nav me-auto">
    {% for item in menu %}
        <li class="nav-item">
            <a class="nav-link py-2 {% if item.selected %}active{% endif %}" href="{{ item.url }}"
               {% if item.selected %}aria-current="page"{% endif %}>
                {% if item.icon %}<i class="bi bi-{{ item.icon }}" aria-hidden="true"></i>{% endif %}
                {{ item.title }}
            </a>
        </li>
    {% endfor %}
</ul>
