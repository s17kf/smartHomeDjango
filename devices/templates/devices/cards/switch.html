{% extends 'devices/cards/base.html' %}
{% load i18n %}
{% block icon %}plug{% endblock %}
{% block body %}
    {% if status.state %}
        {% if status.state.on %}
            <span class="badge text-bg-success fs-6">{% trans "ON" %}</span>
        {% else %}
            <span class="badge text-bg-secondary fs-6">{% trans "OFF" %}</span>
        {% endif %}
    {% else %}
        <span class="text-secondary">{% trans "State unknown" %}</span>
    {% endif %}
{% endblock %}
