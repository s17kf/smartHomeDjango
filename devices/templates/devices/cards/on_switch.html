{% load i18n %}
{# Włącz / wyłącz: wysyła przeciwny stan do bieżącego (`set` podaje stan docelowy). #}
{# hx-target i hx-swap jawnie – inaczej dziedziczone z kontenera odświeżającego listę. #}
<div class="form-check form-switch fs-4 mb-0">
    <input class="form-check-input" type="checkbox" role="switch" id="on-{{ status.device.slug }}"
           aria-label="{% trans 'On / off' %}"
           {% if status.state.on %}checked{% endif %}
           {% if not status.available or pending %}disabled{% endif %}
           hx-post="{% url 'devices:device_set' status.device.slug %}"
           hx-vals='{"on": "{% if status.state.on %}false{% else %}true{% endif %}"}'
           hx-target="#device-{{ status.device.slug }}" hx-swap="outerHTML">
</div>
